<!DOCTYPE html><html><head><base target="_top"><style>body{font:14px Arial;padding:16px}label{display:block;margin:12px 0}button{padding:10px 18px;background:#285fce;color:#fff;border:0;border-radius:6px}p{color:#555}</style></head><body>
<p><b>Warning:</b> This replaces all rows in the selected tab. Take a spreadsheet backup first. Upload CSV (UTF-8) only.</p>
<label>Tab <select id="tab"><option>CUSTOMER_MASTER</option><option>SALES_DATA</option><option>BUDGET_DATA</option><option>STOCK_DATA</option><option>OVER_STOCK</option><option>TARGET_PARTY</option><option>PRODUCT_MASTER</option></select></label>
<label>CSV file <input type="file" id="file" accept=".csv"></label><button id="send">Replace tab from CSV</button><p id="msg"></p>
<script>document.getElementById('send').onclick=async()=>{const f=document.getElementById('file').files[0];if(!f){document.getElementById('msg').textContent='Choose a CSV file';return}if(!confirm('Replace all data in '+document.getElementById('tab').value+'?'))return;document.getElementById('msg').textContent='Importing…';google.script.run.withSuccessHandler(x=>document.getElementById('msg').textContent=x).withFailureHandler(e=>document.getElementById('msg').textContent='Error: '+e.message).importCsvToTab(document.getElementById('tab').value,await f.text())}</script></body></html>
